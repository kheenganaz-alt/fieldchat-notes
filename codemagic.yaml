workflows:
  android-apk:
    name: Android APK Build

    environment:
      node: latest
      java: 17

    scripts:
      - npm install
      - npm run build
      - npx cap sync android
      - ls -la android
      - cd android
      - if [ -f "./gradlew" ]; then chmod +x ./gradlew && ./gradlew assembleDebug; elif [ -f "./gradlew.bat" ]; then ./gradlew.bat assembleDebug; else echo "No Gradle wrapper found"; exit 1; fi

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab